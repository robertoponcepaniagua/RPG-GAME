<!DOCTYPE html>
<html>
<head>
    <title>RPG Avanzado</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
<link rel="stylesheet" href="style.css">
<body>

    <div id="status-container">
        <span id="status-dot" class="dot disconnected"></span>
        <span id="status-text">Desconectado</span>
    </div>

    <h1>Árbol de Habilidades Jerárquico</h1>

    <div class="skill-tree">
        <div class="skill">
            <strong>Corte</strong><br>
            Nivel: 3/5
            <button onclick="socket.emit('mejorar_habilidad', {id: 1})">Subir Nivel</button>
        </div>

        <span>➔</span>

        <div class="skill">
            <strong>Torbellino</strong><br>
            Nivel: 0/5 (Requiere Corte Nvl 3)
            <button onclick="socket.emit('mejorar_habilidad', {id: 2})">Desbloquear</button>
        </div>
    </div>


    <h2>👥 Aventureros en el Reino</h2>
    <div id="contenedor-personajes" class="personajes-grid">
        </div>

    <div id="log">> Sistema iniciado.</div>

    <script>
        // Inicializar socket una sola vez
        const socket = io();
        const dot = document.getElementById('status-dot');
        const text = document.getElementById('status-text');
        const logBox = document.getElementById('log');

        // Gestión visual de la conexión
        socket.on('connect', () => {
            dot.className = 'dot connected';
            text.innerText = 'Conectado';
            console.log("Conectado con éxito");
        });

        socket.on('disconnect', () => {
            dot.className = 'dot disconnected';
            text.innerText = 'Desconectado';
        });

        // Escuchar mensajes del servidor
        socket.on('status', (data) => {
            logBox.innerText = "> " + data.msg;
        });

        // 1. Pedir los personajes en cuanto conectamos
    socket.on('connect', () => {
        socket.emit('obtener_personajes'); // Avisamos al Python que queremos la lista
    });

    // 2. Escuchar la respuesta del servidor
    socket.on('personajes', (lista) => {
        const contenedor = document.getElementById('contenedor-personajes');
        contenedor.innerHTML = ""; // Limpiar antes de llenar

    lista.forEach(p => {
        // Creamos el HTML dinámicamente para cada personaje
        contenedor.innerHTML += `
            <div class="card-personaje">
                <h3>${p.nombre}</h3>
                <p class="info-p">⭐ Nivel: ${p.nivel}</p>
                <p class="info-p">💰 Oro: ${p.oro}</p>
                <p class="info-p">❤️ Vida: ${p.vida_actual}</p>
            </div>
        `;
    });
});

    </script>
</body>
</html>
